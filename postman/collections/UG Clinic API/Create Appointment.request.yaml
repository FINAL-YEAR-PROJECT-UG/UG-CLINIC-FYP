$kind: http-request
method: POST
url: '{{baseUrl}}/api/appointments'
order: 9000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{accessToken}}'
body:
  type: json
  content: |-
    {
      "serviceId": "{{serviceId}}",
      "date": "{{appointmentDateTime}}",
      "timeSlot": "{{timeSlot}}",
      "reason": "{{appointmentReason}}",
      "notes": "{{appointmentNotes}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Create appointment returns expected outcome', function () {
        pm.expect(pm.response.code).to.be.oneOf([201, 400, 401, 404, 409, 500]);
      });
