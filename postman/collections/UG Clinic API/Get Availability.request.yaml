$kind: http-request
method: GET
url: '{{baseUrl}}/api/appointments/availability'
order: 8000
headers:
  - key: Authorization
    value: 'Bearer {{accessToken}}'
queryParams:
  - key: date
    value: '{{appointmentDate}}'
  - key: serviceId
    value: '{{serviceId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Availability returns expected outcome', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 400, 401, 500]);
      });
