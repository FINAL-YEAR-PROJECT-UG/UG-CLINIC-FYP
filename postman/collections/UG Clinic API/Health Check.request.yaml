$kind: http-request
method: GET
url: '{{baseUrl}}/health'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Response has ok status', function () {
        const json = pm.response.json();
        pm.expect(json.status).to.eql('ok');
      });
