$kind: http-request
method: GET
url: '{{baseUrl}}/api/services'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Services payload shape is valid', function () {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data).to.have.property('services');
        pm.expect(json.data.services).to.be.an('array');
      });
