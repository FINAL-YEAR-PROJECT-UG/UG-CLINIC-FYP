$kind: http-request
method: POST
url: '{{baseUrl}}/api/admin/cleanup-sessions'
order: 2000
headers:
  - key: Authorization
    value: 'Bearer {{accessToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Cleanup sessions returns expected outcome', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 401, 403, 500]);
      });
