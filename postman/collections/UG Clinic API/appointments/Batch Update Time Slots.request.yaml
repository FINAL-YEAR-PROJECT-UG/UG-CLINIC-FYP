$kind: http-request
method: PATCH
url: '{{baseUrl}}/api/appointments/timeslots/batch'
order: 9000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{accessToken}}'
body:
  type: json
  content: |-
    {
      "date": "{{appointmentDate}}",
      "action": "SYNC_DOCTORS",
      "sessionFilter": "MORNING"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Batch update time slots returns expected outcome', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 400, 401, 403, 404, 500]);
      });
