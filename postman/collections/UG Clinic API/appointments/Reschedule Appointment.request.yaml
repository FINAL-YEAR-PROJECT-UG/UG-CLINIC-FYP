$kind: http-request
name: 'Reschedule Appointment'
method: PATCH
url: '{{baseUrl}}/api/appointments/{{appointmentId}}/reschedule'
order: 4000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{accessToken}}'
body:
  type: json
  content: |-
    {
      "date": "2026-07-16",
      "timeSlot": "11:00"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Reschedule appointment returns expected outcome', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 400, 401, 403, 404, 409, 500]);
      });
