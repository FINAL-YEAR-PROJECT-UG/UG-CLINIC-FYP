$kind: http-request
method: POST
url: '{{baseUrl}}/api/appointments/{{appointmentId}}/staff-cancel'
order: 7500
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{accessToken}}'
body:
  type: json
  content: |-
    {
      "cancellationReason": "Patient did not show up",
      "cancellationNote": "Cancelled by receptionist after no-show"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Staff cancel appointment returns expected outcome', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 400, 401, 403, 404, 500]);
      });
