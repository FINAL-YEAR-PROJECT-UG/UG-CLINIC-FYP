$kind: http-request
name: 'Change Password'
method: POST
url: '{{baseUrl}}/api/auth/change-password'
order: 11500
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{accessToken}}'
body:
  type: json
  content: |-
    {
      "currentPassword": "StrongPass123!",
      "newPassword": "NewStrongPass123!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Change password returns expected outcome', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 400, 401, 500]);
      });
