$kind: http-request
name: 'Reset Password With OTP'
method: POST
url: '{{baseUrl}}/api/auth/reset-password-otp'
order: 9000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "student@example.com",
      "otp": "123456",
      "newPassword": "NewStrongPass123!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Reset password with OTP returns expected outcome', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 400, 401, 500]);
      });
