$kind: http-request
name: 'Reset Password'
method: POST
url: '{{baseUrl}}/api/auth/reset-password'
order: 7500
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "token": "reset-token-placeholder",
      "newPassword": "NewStrongPass123!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Reset password returns expected outcome', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 400, 401, 500]);
      });
