$kind: http-request
name: 'Send OTP'
method: POST
url: '{{baseUrl}}/api/auth/send-otp'
order: 8000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "student@example.com",
      "studentId": "12345678",
      "method": "email"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Send OTP returns expected outcome', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 400, 404, 500]);
      });
