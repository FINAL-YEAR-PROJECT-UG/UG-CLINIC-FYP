$kind: http-request
method: DELETE
url: '{{baseUrl}}/api/news/{{newsPostId}}'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{accessToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Delete news post returns expected outcome', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 401, 403, 404, 500]);
      });
