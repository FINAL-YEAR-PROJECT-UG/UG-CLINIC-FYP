$kind: http-request
method: GET
url: '{{baseUrl}}/api/news?page=1&pageSize=20&category=&priority='
order: 1000
queryParams:
  - key: page
    value: '1'
  - key: pageSize
    value: '20'
  - key: category
    value: ''
  - key: priority
    value: ''
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('News posts payload shape is valid', function () {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data).to.have.property('newsPosts');
        pm.expect(json.data.newsPosts).to.be.an('array');
      });
