$kind: http-request
method: PUT
url: '{{baseUrl}}/api/news/{{newsPostId}}'
order: 3000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{accessToken}}'
body:
  type: json
  content: |-
    {
      "title": "Updated Clinic Hours",
      "content": "Updated content for the news post.",
      "priority": "medium",
      "isPublic": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Update news post returns expected outcome', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 400, 401, 403, 404, 500]);
      });
