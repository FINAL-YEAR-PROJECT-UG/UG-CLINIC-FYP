$kind: http-request
name: 'Create Resource'
method: POST
url: '{{baseUrl}}/api/resources'
order: 3000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{accessToken}}'
body:
  type: json
  content: |-
    {
      "title": "Hydration Guide",
      "description": "Wellness guide for students",
      "fileUrl": "https://example.com/files/hydration-guide.pdf",
      "fileType": "application/pdf",
      "fileSize": 245760,
      "category": "Wellness",
      "tags": ["health", "student"],
      "isPublic": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Create resource returns expected outcome', function () {
        pm.expect(pm.response.code).to.be.oneOf([201, 400, 401, 403, 500]);
      });
      if (pm.response.code === 201) {
        const json = pm.response.json();
        pm.environment.set('resourceId', json.data.resource.id);
      }
