$kind: http-request
name: 'List Resources For Staff'
method: GET
url: '{{baseUrl}}/api/resources/staff'
order: 2000
headers:
  - key: Authorization
    value: 'Bearer {{accessToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('List resources for staff returns expected outcome', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 401, 403, 500]);
      });
