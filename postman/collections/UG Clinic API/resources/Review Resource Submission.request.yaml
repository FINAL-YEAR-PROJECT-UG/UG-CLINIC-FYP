$kind: http-request
method: PATCH
url: '{{baseUrl}}/api/resources/{{resourceId}}/review'
order: 4500
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{accessToken}}'
body:
  type: json
  content: |-
    {
      "status": "APPROVED",
      "reviewNote": "Looks good, approved for publication."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Review resource submission returns expected outcome', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 400, 401, 403, 404, 500]);
      });
