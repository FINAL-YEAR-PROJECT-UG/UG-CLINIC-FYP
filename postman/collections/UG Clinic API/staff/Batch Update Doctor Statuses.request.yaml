$kind: http-request
method: PATCH
url: '{{baseUrl}}/api/staff/doctors/batch-status'
order: 13500
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{accessToken}}'
body:
  type: json
  content: |-
    {
      "status": "AVAILABLE",
      "doctorIds": []
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Batch update doctor statuses returns expected outcome', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 400, 401, 403, 500]);
      });
