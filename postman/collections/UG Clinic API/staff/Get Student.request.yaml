$kind: http-request
name: 'Get Student'
method: GET
url: '{{baseUrl}}/api/staff/students/{{studentIdOrUserId}}'
order: 10000
headers:
  - key: Authorization
    value: 'Bearer {{accessToken}}'
  - key: X-Session-Token
    value: '{{sessionToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Get student returns expected outcome', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 401, 403, 404, 500]);
      });
