$kind: http-request
method: POST
url: '{{baseUrl}}/api/staff/resend-2fa'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "doctor@example.com"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Resend staff 2FA returns expected outcome', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 400, 404, 500]);
      });
