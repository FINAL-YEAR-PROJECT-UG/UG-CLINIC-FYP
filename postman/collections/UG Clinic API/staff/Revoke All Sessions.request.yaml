$kind: http-request
name: 'Revoke All Sessions'
method: DELETE
url: '{{baseUrl}}/api/staff/sessions'
order: 6000
headers:
  - key: Authorization
    value: 'Bearer {{accessToken}}'
  - key: X-Session-Token
    value: '{{sessionToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Revoke all sessions returns expected outcome', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 401, 403, 500]);
      });
