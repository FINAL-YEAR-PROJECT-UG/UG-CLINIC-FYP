$kind: http-request
name: 'Revoke Session'
method: DELETE
url: '{{baseUrl}}/api/staff/session/{{sessionId}}'
order: 5000
headers:
  - key: Authorization
    value: 'Bearer {{accessToken}}'
  - key: X-Session-Token
    value: '{{sessionToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Revoke session returns expected outcome', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 401, 403, 404, 500]);
      });
